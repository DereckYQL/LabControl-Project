<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1d"/>
      <stop offset=".45" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#101c38"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".84" cy=".1" r=".62">
      <stop offset="0" stop-color="#F7E40A" stop-opacity=".4"/>
      <stop offset=".5" stop-color="#DFC100" stop-opacity=".16"/>
      <stop offset="1" stop-color="#DFC100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".06" cy=".96" r=".65">
      <stop offset="0" stop-color="#DFC100" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#DFC100" stop-opacity=".13"/>
      <stop offset="1" stop-color="#DFC100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD54A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFD54A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#E8D200" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>

  <!-- Circuito superior derecho -->
  <g fill="none" stroke="#F7E40A" stroke-width="2">
    <path d="M1180 70h330l70 70h250" stroke-opacity=".5"/>
    <path d="M1330 150l60 60h210" stroke-opacity=".32"/>
    <path d="M1450 20v90l50 50h180" stroke-opacity=".24"/>
    <path d="M1250 240h160l50 50h230" stroke-opacity=".28"/>
  </g>
  <g fill="#F7E40A">
    <circle cx="1180" cy="70" r="5" opacity=".85"/>
    <circle cx="1830" cy="140" r="6" opacity=".9"/>
    <circle cx="1600" cy="210" r="5" opacity=".6"/>
    <circle cx="1690" cy="290" r="6" opacity=".75"/>
    <circle cx="1450" cy="20" r="4" opacity=".55"/>
    <circle cx="1250" cy="240" r="4" opacity=".6"/>
  </g>
  <circle cx="1830" cy="140" r="22" fill="url(#glowC)" opacity=".55"/>
  <circle cx="1690" cy="290" r="18" fill="url(#glowC)" opacity=".4"/>

  <!-- Circuito inferior izquierdo -->
  <g fill="none" stroke="#E0C300" stroke-width="2">
    <path d="M-20 850h270l90 90h330" stroke-opacity=".42"/>
    <path d="M110 1030V900l70-70h260" stroke-opacity=".3"/>
    <path d="M420 1060v-80l60-60h200" stroke-opacity=".26"/>
    <path d="M-20 720h150l60 60" stroke-opacity=".24"/>
  </g>
  <g fill="#E0C300">
    <circle cx="670" cy="940" r="6" opacity=".85"/>
    <circle cx="440" cy="830" r="5" opacity=".65"/>
    <circle cx="680" cy="920" r="4" opacity=".5"/>
    <circle cx="110" cy="1030" r="5" opacity=".6"/>
    <circle cx="190" cy="780" r="4" opacity=".5"/>
  </g>
  <circle cx="670" cy="940" r="20" fill="url(#glowC)" opacity=".45"/>

  <!-- Detalles inferiores derechos -->
  <g fill="none" stroke="#F7E40A" stroke-width="2">
    <path d="M1980 620h-240l-70 70h-180" stroke-opacity=".3"/>
    <path d="M1980 800h-160l-60-60h-120" stroke-opacity=".22"/>
  </g>
  <g fill="#F7E40A">
    <circle cx="1490" cy="690" r="5" opacity=".6"/>
    <circle cx="1640" cy="740" r="4" opacity=".5"/>
  </g>

  <!-- Hexágonos -->
  <g fill="none" stroke="#E8D200">
    <polygon points="180,120 214,139 214,177 180,196 146,177 146,139" stroke-opacity=".22"/>
    <polygon points="286,64 306,75 306,99 286,110 266,99 266,75" stroke-opacity=".15"/>
    <polygon points="1740,920 1786,947 1786,999 1740,1026 1694,999 1694,947" stroke-opacity=".2"/>
    <polygon points="1636,1004 1662,1019 1662,1049 1636,1064 1610,1049 1610,1019" stroke-opacity=".13"/>
    <polygon points="960,60 986,75 986,105 960,120 934,105 934,75" stroke-opacity=".14"/>
  </g>

  <!-- Marcas + y puntos -->
  <g stroke="#E8D200" stroke-width="2" stroke-linecap="round">
    <path d="M340 340v24M328 352h24" stroke-opacity=".3"/>
    <path d="M1580 480v20M1570 490h20" stroke-opacity=".26"/>
    <path d="M240 560v20M230 570h20" stroke-opacity=".22"/>
    <path d="M1760 560v18M1751 569h18" stroke-opacity=".24"/>
  </g>
  <g fill="#E8D200">
    <circle cx="480" cy="180" r="3" opacity=".35"/>
    <circle cx="820" cy="120" r="3" opacity=".3"/>
    <circle cx="1360" cy="420" r="3" opacity=".28"/>
    <circle cx="300" cy="640" r="3" opacity=".3"/>
    <circle cx="1120" cy="980" r="3" opacity=".28"/>
    <circle cx="1560" cy="880" r="3" opacity=".3"/>
    <circle cx="700" cy="480" r="3" opacity=".22"/>
    <circle cx="1860" cy="480" r="3" opacity=".3"/>
  </g>

  <!-- Arco decorativo -->
  <circle cx="1920" cy="1080" r="420" fill="none" stroke="#F7E40A" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="6 14"/>
  <circle cx="-40" cy="-40" r="360" fill="none" stroke="#E0C300" stroke-opacity=".12" stroke-width="1.5" stroke-dasharray="6 14"/>

  <!-- Viñeta central suave para legibilidad de la tarjeta -->
  <radialGradient id="vig" cx=".5" cy=".5" r=".72">
    <stop offset=".55" stop-color="#070d1d" stop-opacity="0"/>
    <stop offset="1" stop-color="#050a17" stop-opacity=".55"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
