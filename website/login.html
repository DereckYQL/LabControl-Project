<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Inicia sesion en LabControl, el sistema de gestion de laboratorios de computacion del Liceo INSUCO." />
<meta property="og:title" content="Iniciar sesion · Insuco LabControl" />
<meta property="og:description" content="Inicia sesion en LabControl, el sistema de gestion de laboratorios de computacion del Liceo INSUCO." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://dereckyql.github.io/LabControl-Project/img/logo-insuco.png" />
<meta property="og:url" content="https://dereckyql.github.io/LabControl-Project/login.html" />
<title>Iniciar sesión · Insuco LabControl</title>
<link rel="icon" type="image/png" href="img/logo-insuco.png" />
<link rel="stylesheet" href="style.css?v=12" />
<script>try{var t=localStorage.getItem("lc_tema");if(t==="dark-sidebar")t="oscuro";if(t==="blue-sidebar"||t==="green-sidebar"||t==="azul"||t==="verde")t="claro";if(!["claro","oscuro"].includes(t))t="claro";document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="login-body">
  <a class="skip-nav" href="#login-form">Saltar al formulario</a>

<div class="login-card">
  <div class="login-brand">
    <div class="login-brand__icon"><img src="img/logo-insuco.png" alt="Logo INSUCO" /></div>
    <div>
      <div class="login-brand__name">Insuco LabControl</div>
      <div class="login-brand__sub">Instituto Superior de Comercio</div>
    </div>
  </div>

  <h2 class="login-title">Iniciar sesión</h2>
  <p class="login-desc">Ingresa con tu cuenta institucional</p>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label" for="input-user">Usuario o correo</label>
      <input class="form-input" id="input-user" type="text" placeholder="ej. prof_juan" autocomplete="username" required minlength="3" />
    </div>
    <div class="form-group">
      <label class="form-label" for="input-pass">Contraseña</label>
      <input class="form-input" id="input-pass" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="4" />
    </div>
    <div id="login-error" class="login-error" style="display:none">
      Usuario o contraseña incorrectos.
    </div>
    <button class="btn btn--primary login-submit" type="submit">Ingresar</button>
  </form>

<script src="data.js?v=7"></script>
<script>
  // Si ya hay sesión activa, redirigir al inicio
  if (AUTH.getSesion()) {
    window.location.href = "index.html";
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const user = document.getElementById("input-user").value.trim();
    const pass = document.getElementById("input-pass").value;
    const btn = document.querySelector(".login-submit");
    document.getElementById("login-error").style.display = "none";
    btn.disabled = true;
    btn.textContent = "Ingresando…";
    const result = await AUTH.login(user, pass);
    btn.disabled = false;
    btn.textContent = "Ingresar";
    if (result) {
      window.location.href = "index.html";
    } else {
      document.getElementById("login-error").style.display = "block";
    }
  });
</script>
</body>
</html>
