<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Configuracion avanzada del sistema LabControl: sitio, laboratorios, equipos, red y seguridad." />
<meta property="og:title" content="Configuracion · Insuco LabControl" />
<meta property="og:description" content="Configuracion avanzada del sistema LabControl: sitio, laboratorios, equipos, red y seguridad." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://dereckyql.github.io/LabControl-Project/img/logo-insuco.png" />
<meta property="og:url" content="https://dereckyql.github.io/LabControl-Project/configuracion.html" />
<title>Configuración · Insuco LabControl</title>
<link rel="icon" type="image/png" href="img/logo-insuco.png" />
<link rel="stylesheet" href="style.css?v=2.8.4" />
<script>window.LC_TEMAS=["claro","azul","verde","oscuro"];</script>
<script src="theme.js?v=2.8.4"></script>
</head>
<body>
  <a class="skip-nav" href="#main-content">Saltar al contenido</a>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <img src="img/logo-insuco.png" alt="Insuco LabControl" title="Insuco LabControl">
      <span class="sidebar__brand-name">LabControl</span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar__user">
      <div class="avatar">--</div>
      <div>
        <div class="name">Cargando…</div>
        <div class="role">—</div>
      </div>
    </div>
  </aside>

  <main class="main-content" id="main-content" role="main">
    <header class="page-header">
      <div>
        <h1>Configuración</h1>
        <p id="cfg-subtitulo">Ajustes de tu cuenta y preferencias personales</p>
      </div>
      <div class="cfg-acciones">
        <button class="btn cfg-ayuda-btn" id="btn-ayuda" type="button" title="Ayuda y soporte" aria-label="Ayuda y soporte" aria-haspopup="true" aria-expanded="false">
          <i data-lucide="help-circle"></i>
        </button>
        <button class="btn btn--primary" id="btn-guardar-cfg">Guardar cambios</button>
        <div class="cfg-ayuda-menu" id="cfg-ayuda-menu">
          <button type="button" data-opcion="faq"><i data-lucide="messages-square"></i> Ayuda / FAQ</button>
          <button type="button" data-opcion="terminos"><i data-lucide="scroll-text"></i> Términos y condiciones</button>
          <button type="button" data-opcion="acerca"><i data-lucide="info"></i> Acerca de</button>
        </div>
      </div>
    </header>

    <div class="cfg-layout">
      <!-- Tabs laterales -->
      <nav class="cfg-sidenav" id="cfg-sidenav"></nav>

      <!-- Paneles -->
      <div class="cfg-panels" id="cfg-panels"></div>
    </div>
  </main>
</div>

<!-- Modal de ayuda / preguntas frecuentes -->
<div class="modal-overlay" id="modal-ayuda" style="display:none">
  <div class="modal modal--lg" role="dialog" aria-modal="true" aria-labelledby="modal-ayuda-titulo">
    <div class="modal__header">
      <div class="modal__title" id="modal-ayuda-titulo">Ayuda</div>
      <button class="modal__close" type="button" aria-label="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <div class="modal__body" id="modal-ayuda-cuerpo"></div>
  </div>
</div>

<script src="data.js?v=2.8.4"></script>
<script src="lucide.min.js?v=2.8.4"></script>
<script src="app.js?v=2.8.4"></script>
<script src="configuracion.js?v=2.8.4"></script>
</body>
</html>
