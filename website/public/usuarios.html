<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Gestion de profesores, permisos y niveles de acceso del sistema LabControl." />
<meta property="og:title" content="Usuarios · Insuco LabControl" />
<meta property="og:description" content="Gestion de profesores, permisos y niveles de acceso del sistema LabControl." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://dereckyql.github.io/LabControl-Project/img/logo-insuco.png" />
<meta property="og:url" content="https://dereckyql.github.io/LabControl-Project/usuarios.html" />
<link rel="canonical" href="https://dereckyql.github.io/LabControl-Project/usuarios.html" />
<meta name="theme-color" content="#ffc300" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
<title>Usuarios · Insuco LabControl</title>
<link rel="icon" type="image/png" href="img/logo-insuco.png" />
<link rel="stylesheet" href="style.css?v=3.5" />
<script src="theme.js?v=3.5"></script>
</head>
<body>
  <a class="skip-nav" href="#main-content">Saltar al contenido</a>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <img src="img/logo-insuco.png" alt="Insuco LabControl" title="Insuco LabControl">
      <span class="sidebar__brand-name">LabControl</span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar__user">
      <div class="avatar">--</div>
      <div>
        <div class="name">Cargando…</div>
        <div class="role">—</div>
      </div>
    </div>
  </aside>

  <main class="main-content" id="main-content" role="main" tabindex="-1">
    <header class="page-header">
      <div>
        <h1>Usuarios</h1>
        <p>Profesores del establecimiento, áreas y niveles de acceso</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select class="form-input" id="filtro-rol" style="width:180px;margin:0">
          <option value="">Todos los roles</option>
          <option value="admin">Administrador</option>
          <option value="programacion">Programación</option>
          <option value="otro_area">Otra área</option>
        </select>
        <input class="form-input" id="filtro-busq-usr" type="search"
          placeholder="Buscar…" style="width:170px;margin:0" />
        <button class="btn btn--primary" id="btn-nuevo-usuario">+ Nuevo usuario</button>
      </div>
    </header>

    <!-- Tarjetas de resumen -->
    <div class="stat-grid" id="usr-stats" style="margin-bottom:20px"></div>

    <!-- Grid de tarjetas de usuario -->
    <div class="usr-grid" id="usr-grid"></div>

    <!-- Vista detalle de usuario -->
    <div id="vista-usr-detalle" style="display:none;margin-top:10px">
      <div style="margin-bottom:14px">
        <button class="btn" id="btn-volver-usr">← Volver a usuarios</button>
      </div>
      <div class="card">
        <div style="padding:24px 24px 0">
          <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
            <div class="usr-avatar-lg" id="det-avatar"></div>
            <div style="flex:1">
              <div style="font-weight:700;font-size:1.25rem" id="det-nombre"></div>
              <div style="color:var(--color-text-muted);font-size:.9rem;margin-top:2px" id="det-email"></div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
                <span class="badge" id="det-rol-badge"></span>
                <span class="badge badge--muted" id="det-nivel-badge"></span>
              </div>
            </div>
            <div id="det-acciones-admin" style="display:none;gap:8px">
              <button class="btn" id="btn-editar-usr">Editar</button>
              <button class="btn btn--danger" id="btn-desactivar-usr">Desactivar</button>
            </div>
          </div>

          <div class="tabs" style="margin-top:20px">
            <button class="tab-btn is-active" data-tab="det-info">Información</button>
            <button class="tab-btn" data-tab="det-permisos">Permisos</button>
            <button class="tab-btn" data-tab="det-actividad">Actividad</button>
          </div>
        </div>

        <div class="tab-panel is-active" data-panel="det-info" style="padding:20px">
          <dl class="info-grid" id="det-info-grid"></dl>
        </div>

        <div class="tab-panel" data-panel="det-permisos" style="padding:20px">
          <div id="det-permisos-list"></div>
        </div>

        <div class="tab-panel" data-panel="det-actividad" style="padding:20px">
          <div id="det-actividad-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal nuevo / editar usuario -->
<div class="modal-overlay" id="modal-usuario" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-usr-titulo">
  <div class="modal modal--lg">
    <div class="modal__header">
      <span class="modal__title" id="modal-usr-titulo">Nuevo usuario</span>
      <button class="modal__close" id="btn-cerrar-usr-modal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal__body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input class="form-input" id="usr-nombre" type="text" placeholder="Nombre" required minlength="2" />
        </div>
        <div class="form-group">
          <label class="form-label">Apellido</label>
          <input class="form-input" id="usr-apellido" type="text" placeholder="Apellido" required minlength="2" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Correo institucional</label>
        <input class="form-input" id="usr-email" type="email" placeholder="nombre@liceo.cl" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Usuario (ID)</label>
          <input class="form-input" id="usr-id" type="text" placeholder="prof_nombre" required minlength="3" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input class="form-input" id="usr-pass" type="password" placeholder="Mínimo 6 caracteres" required minlength="6" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Área</label>
          <input class="form-input" id="usr-area" type="text" placeholder="Ej: Programación, Matemáticas…" />
        </div>
        <div class="form-group">
          <label class="form-label">Especialidad</label>
          <input class="form-input" id="usr-especialidad" type="text" placeholder="Ej: Desarrollo Web" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Rol</label>
          <select class="form-input" id="usr-rol">
            <option value="programacion">Profesor Programación</option>
            <option value="otro_area">Profesor otra área</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Nivel de acceso</label>
          <select class="form-input" id="usr-nivel">
            <option value="basico">Básico</option>
            <option value="tecnico">Técnico</option>
            <option value="total">Total (admin)</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn" id="btn-cancelar-usr-modal">Cancelar</button>
      <button class="btn btn--primary" id="btn-guardar-usr">Guardar usuario</button>
    </div>
  </div>
</div>

<script type="module" src="data.js?v=3.5"></script>
<script src="lucide.min.js?v=3.5"></script>
<script type="module" src="app.js?v=3.5"></script>
<script type="module" src="usuarios.js?v=3.5"></script>
</body>
</html>
