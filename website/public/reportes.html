<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Reportes de uso, disponibilidad, fallas e inventario de los laboratorios del Liceo INSUCO." />
<meta property="og:title" content="Reportes · Insuco LabControl" />
<meta property="og:description" content="Reportes de uso, disponibilidad, fallas e inventario de los laboratorios del Liceo INSUCO." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://dereckyql.github.io/LabControl-Project/img/logo-insuco.png" />
<meta property="og:url" content="https://dereckyql.github.io/LabControl-Project/reportes.html" />
<link rel="canonical" href="https://dereckyql.github.io/LabControl-Project/reportes.html" />
<meta name="theme-color" content="#ffc300" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
<title>Reportes · Insuco LabControl</title>
<link rel="icon" type="image/png" href="img/logo-insuco.png" />
<link rel="stylesheet" href="style.css?v=3.4.1" />
<script src="theme.js?v=3.4.1"></script>
</head>
<body>
  <a class="skip-nav" href="#main-content">Saltar al contenido</a>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <img src="img/logo-insuco.png" alt="Insuco LabControl" title="Insuco LabControl">
      <span class="sidebar__brand-name">LabControl</span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar__user">
      <div class="avatar">--</div>
      <div>
        <div class="name">Cargando…</div>
        <div class="role">—</div>
      </div>
    </div>
  </aside>

  <main class="main-content" id="main-content" role="main" tabindex="-1">
    <header class="page-header">
      <div>
        <h1>Reportes</h1>
        <p>Resúmenes de uso, fallas y disponibilidad de laboratorios</p>
      </div>
      <button class="btn btn--primary" id="btn-nuevo-reporte">+ Generar reporte</button>
    </header>

    <!-- Lista resumida de reportes -->
    <div class="rep-grid" id="rep-grid"></div>

    <!-- Vista detalle de un reporte -->
    <div id="vista-reporte" style="display:none;margin-top:20px">
      <div style="margin-bottom:12px">
        <button class="btn" id="btn-volver-rep">← Volver a reportes</button>
      </div>
      <div class="card">
        <div style="padding:20px 20px 0">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
            <div>
              <div style="font-weight:700;font-size:1.1rem" id="rep-titulo"></div>
              <div style="margin-top:8px;display:flex;gap:10px;font-size:.8rem;color:var(--color-text-muted);flex-wrap:wrap">
                <span id="rep-fecha"></span>
                <span id="rep-autor"></span>
              </div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap" id="rep-acciones"></div>
          </div>
          <p id="rep-descripcion" style="margin-top:14px;font-size:.9rem;line-height:1.55;white-space:pre-wrap;color:var(--color-text)"></p>
          <div id="rep-adjuntos"></div>
        </div>

        <div style="padding:20px" id="rep-contenido"></div>
      </div>
    </div>
  </main>
</div>

<!-- Visor de imágenes adjuntas -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;cursor:zoom-out;padding:24px">
  <img id="lightbox-img" alt="" style="max-width:min(900px,92vw);max-height:88vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)" />
</div>

<!-- Modal nuevo / editar reporte -->
<div class="modal-overlay" id="modal-reporte" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-rep-titulo">
  <div class="modal" style="max-width:560px">
    <div class="modal__header">
      <span class="modal__title" id="modal-rep-titulo">Generar nuevo reporte</span>
      <button class="modal__close" id="btn-cerrar-rep-modal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal__body">
      <div class="form-group">
        <label class="form-label">Tipo de reporte</label>
        <select class="form-input" id="nuevo-rep-tipo">
          <option value="uso">Uso de laboratorios</option>
          <option value="disponibilidad">Disponibilidad</option>
          <option value="fallas">Registro de fallas</option>
          <option value="inventario">Inventario de equipos</option>
          <option value="otro">Otro</option>
        </select>
        <small class="form-hint" id="hint-otro" hidden>Este tipo no genera gráficos ni tablas automáticas: el reporte contendrá únicamente tu descripción y archivos adjuntos.</small>
      </div>
      <div class="form-group">
        <label class="form-label">Título (obligatorio)</label>
        <input class="form-input" id="nuevo-rep-titulo" type="text" placeholder="Ej: Reporte de agosto 2026" required minlength="3" />
      </div>
      <div class="form-group">
        <label class="form-label">Descripción (obligatoria)</label>
        <textarea class="form-input" id="nuevo-rep-descripcion" rows="4" required minlength="10"
          placeholder="Describe el contexto y las conclusiones del reporte. Sin límite de extensión."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Fecha inicio</label>
          <input class="form-input" type="date" id="nuevo-rep-desde" />
        </div>
        <div class="form-group">
          <label class="form-label">Fecha fin</label>
          <input class="form-input" type="date" id="nuevo-rep-hasta" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Archivos adjuntos (opcional)</label>
        <label class="dropzone" for="nuevo-rep-archivos">
          <i data-lucide="paperclip"></i>
          <span>Haz clic para agregar imágenes, PDF u otros documentos</span>
          <small>Máximo 10 MB por archivo · hasta 10 archivos</small>
        </label>
        <input id="nuevo-rep-archivos" type="file" multiple hidden
          accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.csv,.zip,.rar" />
        <div id="lista-adjuntos" class="adj-chips"></div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn" id="btn-cancelar-rep">Cancelar</button>
      <button class="btn btn--primary" id="btn-generar-rep">Generar</button>
    </div>
  </div>
</div>

<script type="module" src="data.js?v=3.4.1"></script>
<script src="lucide.min.js?v=3.4.1"></script>
<script type="module" src="app.js?v=3.4.1"></script>
<script type="module" src="reportes.js?v=3.4.1"></script>
</body>
</html>
