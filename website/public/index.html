<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Dashboard principal de LabControl: resumen, estado en tiempo real y distribucion de equipos de los laboratorios del Liceo INSUCO." />
<meta property="og:title" content="Inicio · Insuco LabControl" />
<meta property="og:description" content="Dashboard principal de LabControl: resumen, estado en tiempo real y distribucion de equipos de los laboratorios del Liceo INSUCO." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://insuco-labcontrol.pages.dev/img/logo-insuco.png" />
<meta property="og:url" content="https://insuco-labcontrol.pages.dev/index.html" />
<link rel="canonical" href="https://insuco-labcontrol.pages.dev/index.html" />
<meta name="theme-color" content="#ffc300" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
<title>Inicio · Insuco LabControl</title>
<link rel="icon" type="image/png" href="img/logo-insuco.png" />
<link rel="stylesheet" href="style.css?v=3.10.0" />
<script src="theme.js?v=3.10.0"></script>
</head>
<body>
  <a class="skip-nav" href="#main-content">Saltar al contenido</a>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <img src="img/logo-insuco.png" alt="Insuco LabControl" title="Insuco LabControl">
      <span class="sidebar__brand-name">LabControl</span>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar__user">
      <div class="avatar">--</div>
      <div>
        <div class="name">Cargando…</div>
        <div class="role">—</div>
      </div>
    </div>
  </aside>

  <main class="main-content" id="main-content" role="main" tabindex="-1">
    <header class="page-header">
      <div>
        <h1 id="saludo-titulo">Bienvenido a Insuco LabControl</h1>
        <p>Resumen general de los laboratorios de computación</p>
      </div>
      <a class="btn btn--primary" href="disponibilidad.html">Agendar uso →</a>
    </header>

    <!-- Resumen numérico -->
    <div class="stat-grid" id="stat-cards" style="margin-bottom:20px"></div>

    <!-- Estado en tiempo real + distribución -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px">
      <div class="card">
        <div class="section-title">Estado en tiempo real</div>
        <div id="status-list"></div>
      </div>
      <div class="card">
        <div class="section-title">Distribución de equipos</div>
        <div style="padding:20px" id="donut"></div>
      </div>
    </div>

    <!-- Accesos rápidos a laboratorios -->
    <div class="section-title" style="padding:0 4px 10px">Laboratorios</div>
    <div class="lab-grid" id="labs-home"></div>
  </main>
</div>

<!-- Lightbox de imágenes del laboratorio -->
<div id="lightbox-lab" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;align-items:center;justify-content:center;cursor:zoom-out" role="dialog" aria-modal="true" aria-label="Galería de imágenes del laboratorio">
  <button id="lightbox-lab-close" style="position:absolute;top:20px;right:24px;background:rgba(255,255,255,.15);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:20px;z-index:2001">✕</button>
  <button id="lightbox-lab-prev" style="position:absolute;left:20px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:24px;z-index:2001">‹</button>
  <button id="lightbox-lab-next" style="position:absolute;right:20px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:24px;z-index:2001">›</button>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;max-width:90vw;max-height:90vh">
    <img id="lightbox-lab-img" src="" alt="" style="max-width:min(1100px,88vw);max-height:78vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)" />
    <div id="lightbox-lab-counter" style="color:rgba(255,255,255,.85);font-size:0.9rem"></div>
    <div id="lightbox-lab-thumbs" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"></div>
  </div>
</div>

<script type="module" src="data.js?v=3.10.0"></script>
<script src="lucide.min.js?v=3.10.0"></script>
<script type="module" src="app.js?v=3.10.0"></script>
<script type="module" src="index.js?v=3.10.0"></script>
</body>
</html>
