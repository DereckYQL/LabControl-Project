<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inicio · LabControl Liceo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="icon" aria-hidden="true">🖥️</span>
      Insuco LabControl
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar__user">
      <div class="avatar">JP</div>
      <div>
        <div class="name">Dereck</div>
        <div class="role">Administrador</div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1>¡Bienvenido, Dereck!</h1>
        <p>Resumen general de laboratorios</p>
      </div>
    </header>

    <section class="stat-grid" id="stat-cards"></section>

    <section class="two-col">
      <div class="card">
        <div class="section-title">Estado en tiempo real</div>
        <div id="status-list"></div>
      </div>
      <div class="card">
        <div class="section-title">Distribución de equipos</div>
        <div id="donut"></div>
      </div>
    </section>

    <section>
      <div class="section-title" style="padding-left:0">Laboratorios</div>
      <div class="lab-grid" id="lab-grid"></div>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  renderSidebar("index.html");
  cargarLaboratorios().then((labs) => {
    renderStatCards(labs, "stat-cards");
    renderStatusList(labs, "status-list");
    renderDonut(labs, "donut");
    renderLabGrid(labs, "lab-grid", { linkTo: "laboratorios.html" });
  });
</script>
</body>
</html>
