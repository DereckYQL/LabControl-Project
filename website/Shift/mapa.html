<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapa 2D · Insuco LabControl</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="icon" aria-hidden="true">🖥️</span>
      Insuco LabControl
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal"></nav>
    <div class="sidebar__user">
      <div class="avatar">--</div>
      <div>
        <div class="name">Cargando…</div>
        <div class="role">—</div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1>Mapa 2D del establecimiento</h1>
        <p>Plano del segundo piso — Ala B (laboratorios de computación)</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <span class="legend-dot legend-dot--disponible"></span><span style="font-size:.82rem">Disponible</span>
        <span class="legend-dot legend-dot--ocupado"></span><span style="font-size:.82rem">Ocupado</span>
        <span class="legend-dot legend-dot--mantencion"></span><span style="font-size:.82rem">Mantención</span>
      </div>
    </header>

    <div class="card" style="padding:20px">
      <!-- Plano SVG del establecimiento -->
      <div class="mapa-wrapper">
        <svg id="mapa-svg" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg"
          role="img" aria-label="Plano del segundo piso ala B">

          <!-- Contorno del edificio -->
          <rect x="10" y="10" width="880" height="400" rx="8" ry="8"
            fill="#1a2740" stroke="#2f6fed" stroke-width="2"/>

          <!-- Pasillo central -->
          <rect x="10" y="195" width="880" height="30"
            fill="#243554" stroke="none"/>
          <text x="450" y="215" fill="#667085" font-size="11" text-anchor="middle">PASILLO CENTRAL — ALA B</text>

          <!-- Escaleras -->
          <rect x="820" y="10" width="70" height="60" rx="4" fill="#1e3050" stroke="#3d5a80" stroke-width="1.5"/>
          <text x="855" y="44" fill="#8494a9" font-size="10" text-anchor="middle">ESCALERA</text>

          <!-- Baños -->
          <rect x="820" y="350" width="70" height="60" rx="4" fill="#1e3050" stroke="#3d5a80" stroke-width="1.5"/>
          <text x="855" y="384" fill="#8494a9" font-size="10" text-anchor="middle">BAÑOS</text>

          <!-- Sala de profesores -->
          <rect x="10" y="10" width="120" height="80" rx="4" fill="#1e3050" stroke="#3d5a80" stroke-width="1.5"/>
          <text x="70" y="48" fill="#8494a9" font-size="10" text-anchor="middle">SALA</text>
          <text x="70" y="62" fill="#8494a9" font-size="10" text-anchor="middle">PROFESORES</text>

          <!-- Laboratorios (se renderizan dinámicamente vía JS) -->
          <g id="labs-group"></g>

          <!-- Leyenda de salas en el mapa -->
          <text x="20" y="406" fill="#4a6080" font-size="9">Liceo Industrial — Plano referencial, segundo piso ala B</text>
        </svg>
      </div>

      <!-- Tooltip flotante -->
      <div class="mapa-tooltip" id="mapa-tooltip" style="display:none"></div>
    </div>

    <!-- Panel lateral de info del lab seleccionado -->
    <div class="card" id="panel-lab" style="margin-top:16px;display:none">
      <div style="padding:16px 20px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div>
            <div style="font-weight:700;font-size:1.05rem" id="panel-nombre"></div>
            <div style="color:var(--color-text-muted);font-size:.85rem" id="panel-sala"></div>
          </div>
          <span class="badge" id="panel-badge"></span>
        </div>
        <dl class="info-grid" id="panel-info"></dl>
        <div style="display:flex;gap:8px;margin-top:16px">
          <a class="btn btn--primary" id="panel-link-lab">Ver detalle completo</a>
          <a class="btn" id="panel-link-disp">Agenda / Reservar</a>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  renderSidebar("mapa.html");

  // Colores de estado para el SVG
  const MAPA_COLORES = {
    disponible: { fill: "#16a34a22", stroke: "#16a34a", text: "#16a34a" },
    ocupado:    { fill: "#ef444422", stroke: "#ef4444", text: "#ef4444" },
    mantencion: { fill: "#f59e0b22", stroke: "#f59e0b", text: "#f59e0b" }
  };

  // Posiciones fijas de los laboratorios en el plano SVG
  const POSICIONES_LABS = [
    { id: 1, x: 140,  y: 20,  w: 155, h: 165 },
    { id: 2, x: 305,  y: 20,  w: 155, h: 165 },
    { id: 3, x: 470,  y: 20,  w: 155, h: 165 },
    { id: 4, x: 635,  y: 20,  w: 175, h: 165 },
    { id: 5, x: 140,  y: 235, w: 320, h: 155 }
  ];

  cargarLaboratorios().then((labs) => {
    const g = document.getElementById("labs-group");
    POSICIONES_LABS.forEach((pos) => {
      const lab    = labs.find((l) => l.id === pos.id);
      if (!lab) return;
      const colores = MAPA_COLORES[lab.estado];

      // Fondo del laboratorio
      const rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
      rect.setAttribute("x",      pos.x);
      rect.setAttribute("y",      pos.y);
      rect.setAttribute("width",  pos.w);
      rect.setAttribute("height", pos.h);
      rect.setAttribute("rx",     "6");
      rect.setAttribute("fill",   colores.fill);
      rect.setAttribute("stroke", colores.stroke);
      rect.setAttribute("stroke-width", "2");
      rect.style.cursor = "pointer";

      // Icono
      const icon = document.createElementNS("http://www.w3.org/2000/svg","text");
      icon.setAttribute("x",           pos.x + pos.w / 2);
      icon.setAttribute("y",           pos.y + 30);
      icon.setAttribute("text-anchor", "middle");
      icon.setAttribute("font-size",   "22");
      icon.textContent = "🖥️";

      // Nombre
      const nombre = document.createElementNS("http://www.w3.org/2000/svg","text");
      nombre.setAttribute("x",           pos.x + pos.w / 2);
      nombre.setAttribute("y",           pos.y + 58);
      nombre.setAttribute("text-anchor", "middle");
      nombre.setAttribute("font-size",   "11");
      nombre.setAttribute("fill",        "#e2e8f0");
      nombre.setAttribute("font-weight", "700");
      nombre.textContent = lab.nombre;

      // Sala
      const sala = document.createElementNS("http://www.w3.org/2000/svg","text");
      sala.setAttribute("x",           pos.x + pos.w / 2);
      sala.setAttribute("y",           pos.y + 72);
      sala.setAttribute("text-anchor", "middle");
      sala.setAttribute("font-size",   "9");
      sala.setAttribute("fill",        "#8494a9");
      sala.textContent = lab.sala;

      // Estado
      const estado = document.createElementNS("http://www.w3.org/2000/svg","text");
      estado.setAttribute("x",           pos.x + pos.w / 2);
      estado.setAttribute("y",           pos.y + 92);
      estado.setAttribute("text-anchor", "middle");
      estado.setAttribute("font-size",   "10");
      estado.setAttribute("fill",        colores.text);
      estado.setAttribute("font-weight", "600");
      estado.textContent = `● ${ESTADOS[lab.estado].label}`;

      // Equipos
      const equip = document.createElementNS("http://www.w3.org/2000/svg","text");
      equip.setAttribute("x",           pos.x + pos.w / 2);
      equip.setAttribute("y",           pos.y + 110);
      equip.setAttribute("text-anchor", "middle");
      equip.setAttribute("font-size",   "9");
      equip.setAttribute("fill",        "#667085");
      equip.textContent = `${lab.equipos} equipos`;

      // Grupo clickeable
      const grp = document.createElementNS("http://www.w3.org/2000/svg","g");
      grp.setAttribute("role",        "button");
      grp.setAttribute("aria-label",  lab.nombre);
      grp.setAttribute("tabindex",    "0");
      grp.style.cursor = "pointer";
      grp.appendChild(rect);
      grp.appendChild(icon);
      grp.appendChild(nombre);
      grp.appendChild(sala);
      grp.appendChild(estado);
      grp.appendChild(equip);

      grp.addEventListener("click",   () => seleccionarLab(lab));
      grp.addEventListener("keydown", (e) => { if (e.key === "Enter") seleccionarLab(lab); });

      // Hover highlight
      grp.addEventListener("mouseenter", () => rect.setAttribute("stroke-width","3"));
      grp.addEventListener("mouseleave", () => rect.setAttribute("stroke-width","2"));

      g.appendChild(grp);
    });
  });

  function seleccionarLab(lab) {
    const panel  = document.getElementById("panel-lab");
    const estado = ESTADOS[lab.estado];
    document.getElementById("panel-nombre").textContent = lab.nombre;
    document.getElementById("panel-sala").textContent   = `${lab.sala} — ${lab.ubicacion}`;

    const badge = document.getElementById("panel-badge");
    badge.textContent = estado.label;
    badge.className   = `badge badge--${lab.estado}`;

    document.getElementById("panel-info").innerHTML = `
      <div><dt>Equipos</dt><dd>${lab.equipos}</dd></div>
      <div><dt>Responsable</dt><dd>${lab.responsable}</dd></div>
      <div><dt>Horario</dt><dd>${lab.horario}</dd></div>
      ${AUTH.puedeVerTecnico() ? `
        <div><dt>Sistema operativo</dt><dd>${lab.so}</dd></div>
        <div><dt>Procesador</dt><dd>${lab.procesador}</dd></div>
        <div><dt>RAM</dt><dd>${lab.ram}</dd></div>
      ` : `<div><dt>Descripción</dt><dd style="font-weight:400">${lab.descripcion}</dd></div>`}
    `;

    document.getElementById("panel-link-lab").href  = `laboratorios.html?id=${lab.id}`;
    document.getElementById("panel-link-disp").href = `disponibilidad.html`;
    panel.style.display = "block";
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
</script>
</body>
</html>
